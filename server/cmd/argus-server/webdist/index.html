<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus</title>
    <script>
      // 挂载前应用主题，防止 FOUC
      try {
        const t = localStorage.getItem("argus-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
      // 挂载前应用语言（localStorage → 浏览器语言回退 → zh-CN），防止语言闪烁
      try {
        const l = localStorage.getItem("argus-lang");
        document.documentElement.lang =
          l === "en" || l === "zh-CN"
            ? l
            : (navigator.language || "").toLowerCase().startsWith("en")
              ? "en"
              : "zh-CN";
      } catch {
        document.documentElement.lang = "zh-CN";
      }
    </script>
    <script type="module" crossorigin src="/assets/index-7Qv_XhLF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BXOO0lK4.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
