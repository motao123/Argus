# Argus 反向代理样例（nginx，HTTPS 终结）
# 适用：域名反代 + TLS；WS 需要 Upgrade 头透传
# 用法：替换 example.com 与证书路径后放入 /etc/nginx/conf.d/

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 前台 + 后台 + API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（实时推送/终端）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    # 注意：启用本配置后，请在 Argus 环境变量中设置
    # ARGUS_TRUSTED_PROXIES=<本机回环或 nginx 容器 IP>，否则 ClientIP 会记录代理地址。

    # NAT 内网穿透子域（按需，nat.example.com → :9090）
    # server {
    #     listen 443 ssl;
    #     server_name nat.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
