main:
  push:
    - name: verify-and-publish
      services:
        - docker
      stages:
        - name: Go format, build, test and vet
          image: golang:1.26
          script:
            - test -z "$(gofmt -l server agent protocol)"
            - cd server && go build ./... && go test ./... && go vet ./...
            - cd ../agent && go build ./... && go test ./... && go vet ./...
            - cd ../protocol && go build ./... && go test ./... && go vet ./...
        - name: Web build
          image: node:22
          script:
            - corepack enable
            - cd web
            - pnpm install --frozen-lockfile
            - pnpm build
        - name: Build production image
          script:
            - docker build -f deploy/Dockerfile -t "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}" -t "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest" .
        - name: Push production image
          script:
            - docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}"
            - docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
