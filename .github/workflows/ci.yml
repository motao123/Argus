name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go format check
        run: |
          test -z "$(gofmt -l server agent protocol)"
      - name: Go build
        run: |
          cd server && go build ./...
          cd ../agent && go build ./...
          cd ../protocol && go build ./...
      - name: Go test and vet
        run: |
          cd server && go test ./... && go vet ./...
          cd ../agent && go test ./... && go vet ./...
          cd ../protocol && go test ./... && go vet ./...
      - name: Agent cross-platform build
        run: |
          cd agent
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=freebsd GOARCH=amd64 go build ./...

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install & build
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build
      - name: i18n key consistency
        run: |
          cd web && node --experimental-strip-types scripts/check-i18n.mjs
      - name: Frontend tests
        run: |
          cd web && pnpm test
